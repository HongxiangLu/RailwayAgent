<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高铁桥梁质量验收智能问答系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 800px;
            max-width: 95vw;
            height: 90vh;
            max-height: 700px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.12);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            color: white;
            padding: 18px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-header h1 {
            font-size: 18px;
            font-weight: 600;
        }

        .chat-header .badge {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 2px 12px;
            font-size: 12px;
        }

        .chat-messages {
            flex: 1;
            padding: 20px 24px;
            overflow-y: auto;
            background: #fafafa;
        }

        .message {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-items: flex-end;
        }

        .message.bot {
            align-items: flex-start;
        }

        .message .bubble {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 12px;
            word-wrap: break-word;
            line-height: 1.6;
            font-size: 14px;
        }

        .message.user .bubble {
            background: #1a73e8;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.bot .bubble {
            background: white;
            color: #1a1a2e;
            border: 1px solid #e8e8e8;
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
        }

        .markdown-body {
            overflow-x: auto;
        }

        .markdown-body p,
        .markdown-body ul,
        .markdown-body ol,
        .markdown-body pre,
        .markdown-body blockquote,
        .markdown-body table {
            margin: 0.6em 0;
        }

        .markdown-body> :first-child {
            margin-top: 0;
        }

        .markdown-body> :last-child {
            margin-bottom: 0;
        }

        .markdown-body ul,
        .markdown-body ol {
            padding-left: 1.6em;
        }

        .markdown-body h1,
        .markdown-body h2,
        .markdown-body h3 {
            margin: 0.6em 0;
        }

        .markdown-body pre {
            padding: 10px;
            background: #f5f5f5;
            overflow-x: auto;
        }

        .markdown-body code {
            font-family: monospace;
            background: #f5f5f5;
        }

        .markdown-body table {
            border-collapse: collapse;
        }

        .markdown-body th,
        .markdown-body td {
            border: 1px solid #ddd;
            padding: 6px 10px;
        }

        .markdown-body blockquote {
            border-left: 3px solid #ddd;
            padding-left: 12px;
            color: #666;
        }

        .markdown-body img {
            max-width: 100%;
        }

        .message .bubble .cypher {
            margin-top: 8px;
            padding: 8px 12px;
            background: #f0f0f0;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            overflow-x: auto;
            color: #333;
        }

        .message .bubble .data-toggle {
            margin-top: 8px;
            color: #666;
            font-size: 12px;
            cursor: pointer;
            text-decoration: underline;
        }

        .message .bubble .data-toggle:hover {
            color: #1a73e8;
        }

        .message .bubble .raw-data {
            display: none;
            margin-top: 8px;
            padding: 8px 12px;
            background: #f5f5f5;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            overflow-x: auto;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .chat-input-area {
            padding: 16px 24px;
            background: white;
            border-top: 1px solid #e8e8e8;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .chat-input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e8e8e8;
            border-radius: 24px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .chat-input-area input:focus {
            border-color: #1a73e8;
        }

        .chat-input-area button {
            padding: 12px 28px;
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            color: white;
            border: none;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            white-space: nowrap;
        }

        .chat-input-area button:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 12px rgba(26, 115, 232, 0.4);
        }

        .chat-input-area button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .typing-indicator {
            display: none;
            padding: 8px 18px;
            background: white;
            border: 1px solid #e8e8e8;
            border-radius: 12px;
            border-bottom-left-radius: 4px;
        }

        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #999;
            margin: 0 2px;
            animation: typing 1.2s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {

            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.4;
            }

            30% {
                transform: translateY(-6px);
                opacity: 1;
            }
        }

        .message .error {
            color: #d32f2f;
            font-size: 13px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }

        .status-dot.online {
            background: #4caf50;
        }

        .status-dot.offline {
            background: #f44336;
        }

        @media (max-width: 600px) {
            .chat-container {
                height: 100vh;
                max-height: 100vh;
                border-radius: 0;
            }

            .message .bubble {
                max-width: 90%;
                font-size: 13px;
            }

            .chat-input-area {
                padding: 12px 16px;
                flex-wrap: wrap;
            }

            .chat-input-area input {
                font-size: 13px;
            }

            .chat-input-area button {
                padding: 10px 20px;
                font-size: 13px;
            }
        }
    </style>
</head>

<body>
    <div class="chat-container">
        <!-- 头部 -->
        <div class="chat-header">
            <h1>🧠 高铁桥梁质量验收智能问答系统</h1>
            <span class="badge" id="statusBadge">
                <span class="status-dot online" id="statusDot"></span>
                <span id="statusText">在线</span>
            </span>
        </div>

        <!-- 消息区域 -->
        <div class="chat-messages" id="messages">
            <div class="message bot">
                <div class="bubble">
                    👋 你好！我是知识图谱问答助手。<br>
                    你可以问我关于工程质量验收标准的问题，例如：
                    <ul style="margin: 8px 0 0 16px; color: #555; font-size: 13px;">
                        <li>明挖基础包含哪些分部工程？</li>
                        <li>基坑开挖有哪些规范条款？</li>
                        <li>钢筋骨架垂直度的取值范围是多少？</li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- 输入区域 -->
        <div class="chat-input-area">
            <input type="text" id="input" placeholder="输入你的问题..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button id="sendBtn" onclick="sendMessage()">发送</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked@18.1.1/lib/marked.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.17/dist/purify.min.js"></script>
    <script>
        const messagesContainer = document.getElementById('messages');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('sendBtn');

        // ============ 发送消息 ============
        async function sendMessage() {
            const question = input.value.trim();
            if (!question) return;

            // 禁用输入
            input.disabled = true;
            sendBtn.disabled = true;

            // 显示用户消息
            addMessage('user', question);
            input.value = '';

            // 显示打字指示器
            showTyping();

            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question, limit: 30 })
                });

                const data = await response.json();

                // 移除打字指示器
                hideTyping();

                if (data.success) {
                    // 构建回答内容
                    let content = data.answer || '查询完成，但未返回具体结果。';

                    // 如果有 Cypher 查询，显示在下方
                    let extra = '';
                    if (data.cypher) {
                        extra += `<div class="cypher">🔍 ${escapeHtml(data.cypher)}</div>`;
                    }
                    if (data.data && data.data.length > 0) {
                        extra += `<div class="data-toggle" onclick="toggleData(this)">📊 查看原始数据</div>`;
                        extra += `<div class="raw-data">${escapeHtml(JSON.stringify(data.data, null, 2))}</div>`;
                    }

                    addMessage('bot', content, extra);
                } else {
                    addMessage('bot', `❌ 错误：${data.error || '未知错误'}`);
                }
            } catch (error) {
                hideTyping();
                addMessage('bot', `❌ 网络错误：${error.message}`);
            }

            // 恢复输入
            input.disabled = false;
            sendBtn.disabled = false;
            input.focus();
        }

        // ============ 添加消息 ============
        function escapeHtml(text) {
            const span = document.createElement('span');
            span.textContent = String(text);
            return span.innerHTML;
        }

        function addMessage(role, content, extra = '') {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            if (role === 'bot' && window.marked && window.DOMPurify) {
                const answer = document.createElement('div');
                answer.className = 'markdown-body';
                answer.innerHTML = DOMPurify.sanitize(marked.parse(content, { gfm: true, breaks: false }));
                bubble.appendChild(answer);
            } else {
                // CDN 不可用时仍可阅读原文；用户输入始终按纯文本展示。
                const answer = document.createElement('div');
                answer.textContent = content;
                answer.style.whiteSpace = 'pre-wrap';
                bubble.appendChild(answer);
            }
            bubble.insertAdjacentHTML('beforeend', extra);
            div.appendChild(bubble);
            messagesContainer.appendChild(div);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // ============ 打字指示器 ============
        function showTyping() {
            const div = document.createElement('div');
            div.className = 'message bot';
            div.id = 'typingIndicator';
            div.innerHTML = `
                <div class="typing-indicator" style="display:block;">
                    <span></span><span></span><span></span>
                </div>
            `;
            messagesContainer.appendChild(div);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function hideTyping() {
            const el = document.getElementById('typingIndicator');
            if (el) el.remove();
        }

        // ============ 切换显示原始数据 ============
        function toggleData(el) {
            const raw = el.nextElementSibling;
            if (raw.style.display === 'block') {
                raw.style.display = 'none';
                el.textContent = '📊 查看原始数据';
            } else {
                raw.style.display = 'block';
                el.textContent = '📊 收起原始数据';
            }
        }

        // ============ 检查服务状态 ============
        async function checkHealth() {
            try {
                const res = await fetch('/health');
                const data = await res.json();
                const dot = document.getElementById('statusDot');
                const text = document.getElementById('statusText');
                if (data.status === 'ok') {
                    dot.className = 'status-dot online';
                    text.textContent = '在线';
                } else {
                    dot.className = 'status-dot offline';
                    text.textContent = '离线';
                }
            } catch {
                document.getElementById('statusDot').className = 'status-dot offline';
                document.getElementById('statusText').textContent = '离线';
            }
        }

        // 页面打开时立即检查，之后每300秒检查一次状态
        checkHealth();
        setInterval(checkHealth, 300000);
    </script>
</body>

</html>
